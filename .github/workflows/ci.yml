name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build first: the MCP stdio tests spawn the server as its own Node process,
      # which loads the built dist of core, schema and seasons.
      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      # apps/web/e2e does not exist yet (added when the web editor's Playwright smoke test
      # lands, spec 05 §6). This step is a no-op until then, rather than a hard failure, so CI
      # stays meaningful for every package in the meantime.
      - name: Check for apps/web/e2e
        id: e2e-check
        run: |
          if [ -d "apps/web/e2e" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Playwright's Chromium
        if: steps.e2e-check.outputs.present == 'true'
        run: pnpm --filter @horizon36596/zenith-web exec playwright install --with-deps chromium

      - name: Playwright e2e (@horizon36596/zenith-web)
        if: steps.e2e-check.outputs.present == 'true'
        run: pnpm --filter @horizon36596/zenith-web exec playwright test

      # The github reporter writes no HTML report on CI, so the traces of the failing tests in
      # test-results/ are what there is to download.
      - name: Upload Playwright report
        if: steps.e2e-check.outputs.present == 'true' && failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 14

  # The Java robot runtime under robot/, the artifact JitPack serves. Builds the library (an Android
  # library, because SolversLib is only published as an AAR), runs its JVM unit tests, and installs it
  # into the runner's local Maven repository exactly the way jitpack.yml does, so a change that would
  # break the JitPack build breaks here first. `build` also builds and tests :ivy-runtime, the Ivy
  # sources compiled without SolversLib on the classpath, and the
  # conformance suite in :auto-runtime runs every fixture through both runtimes. Its `check` also dexes
  # the release AAR at API 24 with no SolversLib and with no Ivy on the classpath. The runner image
  # ships an Android SDK and sets ANDROID_HOME, which the Android Gradle Plugin reads.
  robot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x robot/gradlew

      - name: Build, test and install the runtime
        run: ./robot/gradlew -p robot build :auto-runtime:publishToMavenLocal :ivy-runtime:testDebugUnitTest

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-test-results
          path: |
            robot/auto-runtime/build/test-results/
            robot/auto-runtime/build/conformance/
            robot/ivy-runtime/build/test-results/
          retention-days: 14
